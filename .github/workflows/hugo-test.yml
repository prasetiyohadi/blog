name: Test Hugo build

on:
  pull_request:
  push:
    branches-ignore: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.1"
          extended: true

      - name: Build with Hugo
        run: hugo --gc --minify
