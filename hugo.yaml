baseURL: "https://blog.pras.my.id/"
languageCode: "en-us"
title: "Pras' Labs"
theme: PaperMod

defaultContentLanguage: "en"
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 10

services:
  googleAnalytics:
    id: G-Z2LHLJQ4RD
  disqus:
    shortname: prasetiyohadigithub

# Search (Fuse.js) reads the JSON index from the home page.
outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

# Main menu: Posts and About. Search is a field in the Nav (layouts/partials/header.html).
# Archive, Tags and RSS are in the footer (layouts/partials/footer.html).
menus:
  main:
    - identifier: posts
      name: Posts
      url: /blogs/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

params:
  env: production
  description: "Strategic Infrastructure Architect with over a decade of experience driving the evolution of high-scale platforms."
  author: "Prasetiyo Hadi Purwoko"

  # Author block at the end of every post (layouts/partials/extend_post_content.html). Text from the LinkedIn About, with "over a decade" in place of "8+ years" so it matches the description above and the About page.
  authorBio:
    role: "Infrastructure Architect"
    avatar: "/images/me.jpg"
    blurb: >-
      Infrastructure Architect with over a decade of experience driving platform evolution at scale, from bare-metal
      data centers to multi-cloud architectures serving millions of users. At Bukalapak, led the shift to
      enterprise-grade IaC and GitOps practices that standardized how engineering teams ship and operate.
      Comfortable owning long-term platform decisions, not just executing them.

  mainSections: ["blogs"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  comments: false  # posts opt in with `comments: true` in front matter (renders Disqus)

  # The wordmark in the Nav. This is the only place ~/pras-labs appears; the site title above is plain text.
  label:
    text: "pras-labs"

  # Used in the home page <title> only: "Pras' Labs: The Hands-On Engineer" (layouts/partials/head.html).
  tagline: "The Hands-On Engineer"

  assets:
    favicon: "/favicon.png"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"
    apple_touch_icon: "/favicon.png"

  homeInfoParams:
    Title: "Hi, I'm Pras"
    Content: >
      DevOps and platform engineer. I write about homelab, Kubernetes,
      storage, networking and the troubleshooting along the way.

  socialIcons:
    - name: github
      url: "https://github.com/prasetiyohadi"
    - name: gitlab
      url: "https://gitlab.com/prasetiyohadi"
    - name: linkedin
      url: "https://linkedin.com/in/prasetiyohadi"
    - name: x
      url: "https://twitter.com/prasetiyohadip"
    - name: rss
      url: "/index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
