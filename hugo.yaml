baseURL: "https://blog.pras.my.id/"
languageCode: "en-us"
title: "Pras@GoPlatformID"
theme: PaperMod

defaultContentLanguage: "en"
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 10

services:
  googleAnalytics:
    id: G-Z2LHLJQ4RD
  disqus:
    shortname: prasetiyohadigithub

# Search (Fuse.js) reads the JSON index from the home page.
outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false

# Main menu: Posts and About. Search is a field in the Nav (layouts/partials/header.html).
# Archive and Tags are in the footer (params.footer.text below).
menus:
  main:
    - identifier: posts
      name: Posts
      url: /blogs/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

params:
  env: production
  description: "Strategic Infrastructure Architect with over a decade of experience driving the evolution of high-scale platforms."
  author: "Prasetiyo Hadi Purwoko"
  mainSections: ["blogs"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  comments: false  # posts opt in with `comments: true` in front matter (renders Disqus)

  label:
    text: "pras-labs"

  # PaperMod prints this between the copyright and "Powered by".
  footer:
    text: "[Archive](/archives/) · [Tags](/tags/)"

  assets:
    favicon: "/favicon.png"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"
    apple_touch_icon: "/favicon.png"

  homeInfoParams:
    Title: "Hi, I'm Pras"
    Content: >
      DevOps and platform engineer. I write about homelab, Kubernetes,
      storage, networking and the troubleshooting along the way.

  socialIcons:
    - name: github
      url: "https://github.com/prasetiyohadi"
    - name: gitlab
      url: "https://gitlab.com/prasetiyohadi"
    - name: linkedin
      url: "https://linkedin.com/in/prasetiyohadi"
    - name: x
      url: "https://twitter.com/prasetiyohadip"
    - name: rss
      url: "/index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
